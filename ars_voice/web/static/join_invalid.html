<!doctype html>
<html lang="ko">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARS 멘트 스튜디오 — 링크 만료</title>
<style>
  body { font-family: -apple-system, "Malgun Gothic", "Noto Sans KR", sans-serif;
         background:#f4f6f8; display:flex; align-items:center; justify-content:center;
         min-height:100vh; margin:0; }
  .card { background:#fff; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,.08);
          padding:2.2rem; width:min(90vw, 380px); text-align:center; }
  h1 { font-size:1.1rem; margin:0 0 .5rem; }
  p  { color:#556; font-size:.9rem; margin:0; }
</style>
</head>
<body>
<div class="card">
  <h1>링크가 유효하지 않습니다</h1>
  <p>초대 링크가 만료되었거나 사용 한도를 초과했습니다.<br>관리자에게 새 초대 링크를 요청해 주세요.</p>
</div>
</body>
</html>
