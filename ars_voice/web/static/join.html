<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARS 멘트 스튜디오 — 참여하기</title>
<style>
  body { font-family: -apple-system, "Malgun Gothic", "Noto Sans KR", sans-serif;
         background:#f4f6f8; display:flex; align-items:center; justify-content:center;
         min-height:100vh; margin:0; }
  .card { background:#fff; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,.08);
          padding:2.2rem; width:min(90vw, 380px); }
  h1 { font-size:1.2rem; margin:0 0 .4rem; }
  p  { color:#556; font-size:.9rem; margin:0 0 1.2rem; }
  input { width:100%; box-sizing:border-box; padding:.7rem .8rem; font-size:1rem;
          border:1px solid #ccd; border-radius:8px; }
  button { width:100%; margin-top:.9rem; padding:.75rem; font-size:1rem; border:0;
           border-radius:8px; background:#2563eb; color:#fff; cursor:pointer; }
  button:hover { background:#1d4ed8; }
  .err { color:#c0392b; font-size:.85rem; margin-top:.6rem; min-height:1.1em; }
</style>
</head>
<body>
<div class="card">
  <h1>ARS 멘트 스튜디오</h1>
  <p>초대 링크가 확인되었습니다. 사용할 이름을 입력하면 프로젝트에 참여합니다.</p>
  <input id="name" placeholder="이름 (예: 홍길동)" maxlength="40" autofocus>
  <button id="go">참여하기</button>
  <div class="err" id="err"></div>
</div>
<script>
async function join() {
  const name = document.getElementById('name').value.trim();
  const err = document.getElementById('err');
  if (!name) { err.textContent = '이름을 입력해 주세요.'; return; }
  const res = await fetch(location.pathname, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({name}),
  });
  if (res.ok) {
    const data = await res.json();
    sessionStorage.setItem('personal_link', data.personal_link);
    location.href = '/';
  } else {
    const data = await res.json().catch(() => ({}));
    err.textContent = data.detail || '참여에 실패했습니다.';
  }
}
document.getElementById('go').addEventListener('click', join);
document.getElementById('name').addEventListener('keydown', e => { if (e.key === 'Enter') join(); });
</script>
</body>
</html>
